<!DOCTYPE html>
<!-- Share thumbnails for awesomemeets.com. One template, four pages, two shapes.
     Open with  thumb.html#home  |  #join  |  #about  |  #data   and add  ,square  for the 1080x1080 version.
     Rendered to PNG by tools/render_thumbs.sh (headless Chrome).
     Deliberately plain (Anna, 30 Sep 2026: the busy version with a card and shapes was "really really ugly and too much"):
     a white ground with a soft warm glow, the name, and one big line. Nothing else. Everything sits in the middle
     630px of the wide version, so a square crop loses nothing. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  html.square, body.square { width: 1080px; height: 1080px; }
  body { position: relative; font-family: 'Space Grotesk', sans-serif; background:
      radial-gradient(60% 70% at 50% 108%, rgba(255, 209, 102, .42), rgba(255, 209, 102, 0) 70%),
      radial-gradient(45% 60% at 84% 100%, rgba(255, 95, 162, .20), rgba(255, 95, 162, 0) 70%),
      radial-gradient(45% 60% at 16% 100%, rgba(255, 140, 66, .18), rgba(255, 140, 66, 0) 70%),
      #FFFFFF; }

  .brand { position: absolute; left: 0; right: 0; top: 54px; display: flex; align-items: center; justify-content: center; gap: 9px; }
  .brand .h { font-family: "Apple Symbols", "Arial Unicode MS", "Segoe UI Symbol", "Noto Sans Symbols2", sans-serif; font-size: 40px; line-height: 1; color: #FF8C42; transform: translateY(9%); }
  .brand .w { font-weight: 700; font-size: 26px; letter-spacing: -.035em; color: #171717; }
  .brand .w span { color: #D11E6E; }

  .stage { position: absolute; left: 50%; top: 0; bottom: 0; width: 600px; margin-left: -300px; padding-top: 34px; display: flex; align-items: center; justify-content: center; }
  h1 { font-weight: 700; font-size: 62px; line-height: 1.03; letter-spacing: -.05em; color: #171717; text-align: center; text-wrap: balance; }
  .g { background: linear-gradient(100deg, #FF8C42, #FF5FA2); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-box-decoration-break: clone; box-decoration-break: clone; padding-bottom: .1em; }

  .g.own { display: block; white-space: nowrap; }

  /* the true square: the same thing, larger */
  .square .brand { top: 96px; gap: 14px; }
  .square .brand .h { font-size: 62px; }
  .square .brand .w { font-size: 40px; }
  .square .stage { width: 940px; margin-left: -470px; padding-top: 50px; }
  .square h1 { font-size: calc(var(--size, 62px) * 1.62); }
</style>
</head>
<body>
  <div class="brand"><span class="h">&#9829;</span><span class="w">Awesome <span>Meets</span></span></div>
  <div class="stage"><h1 id="line"></h1></div>

<script>
  var PAGES = {
    home:  { line: 'When did you last meet someone who <span class="g">isn’t a colleague?</span>', size: 62 },
    join:  { line: 'Want in for <span class="g">November?</span>', size: 96 },
    about: { line: 'Made by the creators of <span class="g own">The Awesome Marketers</span>', size: 52 },
    data:  { line: 'What happens to <span class="g">your data</span>', size: 84 }
  };
  var parts = location.hash.replace('#', '').split(',');
  var page = PAGES[parts[0]] || PAGES.home;
  if (parts[1] === 'square') { document.documentElement.className = 'square'; document.body.className = 'square'; }
  var line = document.getElementById('line');
  line.innerHTML = page.line;
  line.style.setProperty('--size', page.size + 'px');
  if (parts[1] !== 'square') line.style.fontSize = page.size + 'px';
</script>
</body>
</html>
