<!DOCTYPE html>
<!-- Event cover for the November round (Anna, 14 Oct 2026: "give me one picture for event cover for the november
     matchmaking", "make it cool"). 16:9, rendered to 1920 x 1080 by headless Chrome:
       "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --disable-gpu --hide-scrollbars \
         --virtual-time-budget=9000 --window-size=1920,1080 --screenshot=cover.png file://$PWD/tools/cover.html
     Same spirit as the share thumbnails (thumb.html): big clean type and a warm glow, no shapes or cards.
     Everything sits well inside the frame, so a platform that crops the edges loses nothing. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  body { position: relative; font-family: 'Space Grotesk', sans-serif; color: #171717; background:
      radial-gradient(48% 62% at 50% 112%, rgba(255, 140, 66, .55), rgba(255, 140, 66, 0) 72%),
      radial-gradient(40% 58% at 88% 104%, rgba(255, 95, 162, .38), rgba(255, 95, 162, 0) 70%),
      radial-gradient(42% 60% at 12% 104%, rgba(255, 209, 102, .55), rgba(255, 209, 102, 0) 70%),
      radial-gradient(60% 60% at 50% 0%, rgba(255, 209, 102, .10), rgba(255, 209, 102, 0) 70%),
      #FFFDFB; }

  .brand { position: absolute; left: 0; right: 0; top: 112px; display: flex; align-items: center; justify-content: center; gap: 14px; }
  .brand .h { font-family: "Apple Symbols", "Arial Unicode MS", "Segoe UI Symbol", sans-serif; font-size: 58px; line-height: 1; color: #FF8C42; transform: translateY(8%); }
  .brand .w { font-weight: 700; font-size: 40px; letter-spacing: -.035em; }
  .brand .w span { color: #D11E6E; }

  .stage { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-top: 30px; text-align: center; }
  h1 { font-weight: 700; font-size: 168px; line-height: .98; letter-spacing: -.055em; }
  h1 .line { display: block; white-space: nowrap; }
  .g { background: linear-gradient(100deg, #FF8C42 10%, #FF5FA2 90%); -webkit-background-clip: text; background-clip: text; color: transparent; padding-bottom: .08em; }

  .foot { position: absolute; left: 0; right: 0; bottom: 118px; display: flex; justify-content: center; gap: 22px; font-weight: 500; font-size: 34px; letter-spacing: -.015em; color: #404040; }
  .foot b { font-weight: 700; color: #171717; }
  .dot { color: #FF8C42; }
</style>
</head>
<body>
  <div class="brand"><span class="h">&#9829;</span><span class="w">Awesome <span>Meets</span></span></div>
  <div class="stage">
    <h1><span class="line">Who will you meet</span><span class="line">in <span class="g">November?</span></span></h1>
  </div>
  <p class="foot"><span>One-to-one or in a trio</span><span class="dot">&#9679;</span><span>Sign up by <b>26 October</b></span><span class="dot">&#9679;</span><span>awesomemeets.com</span></p>
</body>
</html>
